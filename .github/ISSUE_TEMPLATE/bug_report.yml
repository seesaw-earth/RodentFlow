name: "Bug report · 错误报告"
description: "Something doesn't work as described in the user guide · 功能与使用指南描述不符"
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve RodentFlow! 感谢帮助改进 RodentFlow！

        **Issues are public.** Do not attach confidential research videos, unpublished data or personal information.
        **Issues 是公开的**，请勿上传保密科研视频、未发表数据或个人信息。
  - type: dropdown
    id: edition
    attributes:
      label: "Edition · 版本"
      options:
        - "iPhone / iPad"
        - "Mac"
        - "Built from source · 从源码编译"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "App version and build · App 版本号"
      description: "iPhone/iPad: Settings › General › iPhone Storage › RodentFlow. Mac: RodentFlow › About RodentFlow, or TestFlight · iPhone/iPad：设置 › 通用 › iPhone 储存空间 › RodentFlow；Mac：菜单 RodentFlow › 关于，或在 TestFlight 中查看"
      placeholder: "2.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: "System and chip · 系统与芯片"
      placeholder: "iPhone 15, iOS 18.1 · macOS 15.1, Apple M2 / Intel"
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: "Module · 模块"
      options:
        - "Centroid tracking · 质心追踪"
        - "RodentPose (six keypoints · 六关键点)"
        - "Two animals · 两只动物"
        - RodentLimb
        - "TST multi-chamber · 多格悬尾"
        - "Manual entry or import · 手动录入或导入"
        - "Group statistics · 组间统计"
        - "Not analysis-related · 与分析无关"
    validations:
      required: true
  - type: input
    id: assay
    attributes:
      label: "Assay · 范式"
      placeholder: "Open Field · 旷场"
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce · 复现步骤"
      placeholder: |
        1. New task › Open Field
        2. Add a 10-minute MP4 (H.264, 1920×1080, 30 fps)
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "What happened, and what did you expect? · 实际结果与预期"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: "Screenshots, logs or exported files · 截图、日志或导出文件"
      description: "Share only what you are allowed to make public · 只分享可以公开的内容"
  - type: checkboxes
    id: privacy
    attributes:
      label: "Privacy · 隐私"
      options:
        - label: "I have not included confidential research data or personal information · 我没有附上保密科研数据或个人信息"
          required: true
